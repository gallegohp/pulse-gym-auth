server:
  port: 8083

spring:
  application:
    name: pg-ms-notifications

  datasource:
    url: jdbc:mysql://db-notifications:3306/notifications_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: pulsegym
    password: 123
    
  jpa: 
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        register: true
        health-check-path: /actuator/health
        prefer-ip-address: false
        instance-id: ${spring.application.name}
  
  # Configuración de envío de emails
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      
security:
  jwt:
    secret-key: oMYOYPCjKGRjXEHQqcG0F/KwhgMZ7yej4cBdqeMVZsk=
    token-expiration: 3600000
    
logging:
  level:
    com.pulse_gym: DEBUG
    org.springframework.mail: INFO

# Configuración personalizada de notificaciones
notificaciones:
  email:
    enabled: ${MAIL_ENABLED:true}

# Configuración de microservicios
microservicio:
  usuarios:
    url: ${USUARIOS_SERVICE_URL:http://pg-ms-users:8081}
  auth:
    url: ${AUTH_SERVICE_URL:http://pg-ms-auth:8090}