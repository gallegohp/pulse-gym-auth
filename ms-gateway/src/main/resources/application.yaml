server: 
  port: 8080

spring:
  application:
    name: ms-gateway
  cloud:
    consul: 
      host: consul
      port: 8500
      discovery:
        register: true
        health-check-path: /actuator/health
        prefer-ip-address: false
        instance-id: ${spring.application.name}:${random.value}
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
    
security: 
  jwt:
    secret: mysecretkey
    expiration: 3600000