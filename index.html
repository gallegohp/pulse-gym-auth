<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse GYM - Pasarela de Pagos</title>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #111; margin-bottom: 5px; }
        .price { font-size: 32px; font-weight: bold; color: #009ee3; margin: 20px 0; }
        button { background-color: #009ee3; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #007eb5; }
        #walletContainer { margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Pulse GYM</h2>
    <p>Renovación de Membresía Mensual</p>
    <div class="price">$65.000 COP</div>
    
    <button id="checkout-btn">Proceder al Pago</button>
    
    <div id="walletContainer"></div>
</div>

<script>
    // Inicializa Mercado Pago con tu Public Key de Sandbox
    // Reemplázala por tu CREDENCIAL DE PRUEBA (PUBLIC KEY)
const mp = new MercadoPago('TEST-002f23b2-6019-482a-a9f8-b3d5b244dcd5', {
    locale: 'es-CO'
});

    document.getElementById('checkout-btn').addEventListener('click', async () => {
        const btn = document.getElementById('checkout-btn');
        btn.innerText = "Cargando pasarela...";
        btn.disabled = true;

        try {
            // Petición a tu Backend para registrar la intención de pago
            const response = await fetch('http://localhost:9090/api/v1/pagos/pago-app', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-User-Roles': 'ROLE_SOCIO',
                    'X-User-Email': 'juanjose@example.com' // Cambiar por un correo real de pruebas de tu DB
                },
                body: JSON.stringify({
                    idSocioMembresia: 1, // El ID asignado en tu base de datos
                    monto: 65000.00
                })
            });

            const data = await response.json();

            if (data.preferenceId) {
                // Generar el botón oficial de Mercado Pago Wallet
                mp.bricks().create("wallet", "walletContainer", {
                    initialization: {
                        preferenceId: data.preferenceId,
                    },
                    customization: {
                        texts: {
                            valueProp: 'smart_option',
                        },
                    },
                });
                // Ocultamos el botón inicial para dejar solo el de Mercado Pago
                btn.style.display = 'none';
            } else {
                alert("Error al obtener la preferencia de pago.");
                btn.disabled = false;
                btn.innerText = "Proceder al Pago";
            }

        } catch (error) {
            console.error("Error en la conexión:", error);
            alert("No se pudo conectar con el servidor de Pulse GYM.");
            btn.disabled = false;
            btn.innerText = "Proceder al Pago";
        }
    });
</script>

</body>
</html>
