services:

  consul:
    image: consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsegym

  db-users:
    image: mysql:8.0
    container_name: db-users
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: users_db
      MYSQL_USER: pulsegym
      MYSQL_PASSWORD: 
    ports:
      - "3310:3306"
    networks:
      - pulsegym

  ms-auth:
    build: ./ms-auth
    container_name: ms-auth
    ports:
      - "8090:8090"
    depends_on:
      - consul
      - db-users
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-users:3306/users_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: pulsegym
      SPRING_DATASOURCE_PASSWORD: 
    networks:
      - pulsegym

  ms-gateway:
    build: ./ms-gateway
    container_name: ms-gateway
    ports:
      - "8080:8080"
    depends_on:
      - consul
    networks:
      - pulsegym


networks:
  pulsegym:
    driver: bridge

