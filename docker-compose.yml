services:

  consul:
    image: consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    healthcheck:
      test: [ "CMD", "consul", "members" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsegym

  pg-ms-users:
    build:
      context: .
      dockerfile: pg-ms-users/Dockerfile
    container_name: pg-ms-users
    ports:
      - "8081:8081"
    depends_on:
      - consul
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
    networks:
      - pulsegym
    env_file:
      - .env

  pg-ms-auth:
    build:
      context: .
      dockerfile: pg-ms-auth/Dockerfile
    container_name: pg-ms-auth
    ports:
      - "8090:8090"
    depends_on:
      - consul
    environment:
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
      BIOMETRIC_JWT_SECRET: ${BIOMETRIC_JWT_SECRET}
    networks:
      - pulsegym

  pg-ms-operation:
    build:
      context: .
      dockerfile: pg-ms-operation/Dockerfile
    container_name: pg-ms-operation
    ports:
      - "8082:8082"
    depends_on:
      - consul
    environment:
      JWT_SECRET: ${JWT_SECRET}
      BIOMETRIC_JWT_SECRET: ${BIOMETRIC_JWT_SECRET}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
    networks:
      - pulsegym

  pg-ms-notifications:
    build:
      context: .
      dockerfile: pg-ms-notifications/Dockerfile
    container_name: pg-ms-notifications
    ports:
      - "8083:8083"
    depends_on:
      - consul
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
      USUARIOS_SERVICE_URL: http://pg-ms-users:8081
      AUTH_SERVICE_URL: http://pg-ms-auth:8090
    env_file:
      - .env
    networks:
      - pulsegym

  pg-ms-reports:
    build:
      context: .
      dockerfile: pg-ms-reports/Dockerfile
    container_name: pg-ms-reports
    ports:
      - "8084:8084"
    depends_on:
      - consul
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
    networks:
      - pulsegym

  pg-ms-gateway:
    build:
      context: .
      dockerfile: pg-ms-gateway/Dockerfile
    container_name: pg-ms-gateway
    ports:
      - "9090:9090"
    depends_on:
      - consul
    networks:
      - pulsegym
    environment:
      JWT_SECRET: ${JWT_SECRET}

networks:
  pulsegym:
    driver: bridge

