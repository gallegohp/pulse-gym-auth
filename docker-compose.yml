services:

  consul:
    image: consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsegym

  ms-users:
    build: ./ms-users
    container_name: ms-users
    ports:
      - "8081:8081"
    depends_on:
      - consul
      - db-users
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-users:3306/users_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: pulsegym
      SPRING_DATASOURCE_PASSWORD: 123
    networks:
      - pulsegym
  ms-auth:
    build: ./ms-auth
    container_name: ms-auth
    ports:
      - "8090:8090"
    depends_on:
      - consul
      - db-users
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-users:3306/users_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: pulsegym
      SPRING_DATASOURCE_PASSWORD: 123
    networks:
      - pulsegym

  db-users:
    image: mysql:8.0
    container_name: db-users
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: users_db
      MYSQL_USER: pulsegym
      MYSQL_PASSWORD: 123
    ports:
      - "3310:3306"
    networks:
      - pulsegym
  ms-operations:
    build: ./ms-operation
    container_name: ms-operation
    ports:
      - "8082:8082"
    depends_on:
      - consul
      - db-operations
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-operations:3306/operations_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: pulsegym
      SPRING_DATASOURCE_PASSWORD: 123
    networks:
      - pulsegym
  
  db-operations:
    image: mysql:8.0
    container_name: db-operations
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: operations_db
      MYSQL_USER: pulsegym
      MYSQL_PASSWORD: 123
    ports:
      - "3311:3306"
    networks:
      - pulsegym


  ms-gateway:
    build: ./ms-gateway
    container_name: ms-gateway
    ports:
      - "8080:8080"
    depends_on:
      - consul
    networks:
      - pulsegym


networks:
  pulsegym:
    driver: bridge

